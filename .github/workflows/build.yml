# GitHub Actions 自动编译工作流
# 在 Windows 云端环境编译 CustomMCUAlgorithom DLL，并上传产物。
#
# 触发方式：
#   1. 推送到任意分支（push）
#   2. 在 GitHub Actions 页面手动运行（workflow_dispatch）

name: Build DLL

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 解析 vcpkg include 目录到环境变量（保留预留，工程暂不需要额外库）
      - name: Resolve vcpkg include path
        shell: bash
        run: |
          echo "VCPKG_INCLUDE=$VCPKG_INSTALLATION_ROOT/installed/x86-windows/include" >> "$GITHUB_ENV"

      # 编译 Release-x86 (Win32)。
      # 使用 windows-2022 预装 VS2022 的 MSBuild，通过 VsDevCmd.bat 初始化编译环境。
      # 输出 DLL 名由工程 TargetName 决定：5620GEN.dll
      - name: Build (Release x86)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          msbuild CustomMCUAlgorithom.sln /t:Build /m /p:Configuration=Release /p:Platform=x86 /p:ExternalIncludePath="%VCPKG_INCLUDE%"

      # 收集产物
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          found=
          for p in "CustomMCUAlgorithom/Release/5620GEN.dll" "Release/5620GEN.dll" "CustomMCUAlgorithom/Release/CustomMCUAlgorithom.dll"; do
            if [ -f "$p" ]; then cp -f "$p" artifacts/5620GEN.dll; found=1; fi
          done
          [ -z "$found" ] && echo "!! DLL not found" || echo "DLL found"
          ls -la artifacts/

      # 上传产物到运行结果页，供下载
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5620GEN-Release
          path: artifacts/
          if-no-files-found: warn